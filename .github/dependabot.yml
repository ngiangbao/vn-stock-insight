# Tự mở pull request khi các thành phần phụ thuộc có phiên bản mới.
# Workflow "Build & phát hành" chạy kiểm thử trên mỗi PR trước khi bạn gộp.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    groups:
      flutter-packages:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
