name: Build & phát hành

# Tạo tag dạng v1.0.1 (trùng "version" trong pubspec.yaml) và đẩy lên GitHub để build và phát hành
# cho Windows, macOS, Linux, Android. Chạy tay (workflow_dispatch) thì chỉ build, không phát hành.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7
  # Tên dùng trong file cài đặt: tag khi phát hành, "dev-<số lượt chạy>" khi build cho PR/chạy tay
  # (tên nhánh PR có dạng "1/merge", chứa "/" nên không dùng làm tên file được)
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.run_number) }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Khóa ký (nếu đã cấu hình secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          else
            echo "::warning::Chưa có ANDROID_KEYSTORE_BASE64, APK được ký bằng khóa debug."
          fi
      - run: flutter build apk --release
      - run: |
          mkdir dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/vn-stock-insight-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v7
        with: { name: android, path: dist/* }

  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build linux --release
      - run: |
          mkdir -p dist pkg/vn-stock-insight
          cp -r build/linux/x64/release/bundle/. pkg/vn-stock-insight/
          cp linux/install.sh assets/icon.svg pkg/vn-stock-insight/
          tar -C pkg -czf "dist/vn-stock-insight-${VERSION}-linux-x64.tar.gz" vn-stock-insight
      - uses: actions/upload-artifact@v7
        with: { name: linux, path: dist/* }

  windows:
    needs: test
    runs-on: windows-latest
    # Ký số bằng SignPath Foundation (miễn phí cho mã nguồn mở). Các bước ký chỉ chạy khi repo có secret SIGNPATH_API_TOKEN
    # và biến SIGNPATH_ORGANIZATION_ID; chưa có thì build bản chưa ký như trước. Xem docs/CODE_SIGNING.md.
    env:
      SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build windows --release

      # Lượt ký 1: file chạy chính của app, ký trước khi đóng gói để file đã cài cũng có chữ ký
      - name: Tải file chạy lên để ký
        if: ${{ env.SIGNPATH_TOKEN != '' }}
        id: upload-app
        uses: actions/upload-artifact@v7
        with:
          name: windows-app-unsigned
          path: build/windows/x64/runner/Release/vn_stock_insight.exe
      - name: Ký file chạy bằng SignPath
        if: ${{ env.SIGNPATH_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: vn-stock-insight
          signing-policy-slug: release-signing
          artifact-configuration-slug: app-exe
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-app
      - name: Đưa file đã ký vào thư mục build
        if: ${{ env.SIGNPATH_TOKEN != '' }}
        shell: pwsh
        run: Copy-Item signed-app\vn_stock_insight.exe build\windows\x64\runner\Release\vn_stock_insight.exe -Force

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - shell: pwsh
        run: |
          $packageVersion = $env:VERSION.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$packageVersion" tool\windows-installer.iss

      # Lượt ký 2: bộ cài
      - name: Tải bộ cài lên để ký
        if: ${{ env.SIGNPATH_TOKEN != '' }}
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-unsigned
          path: dist/*-setup.exe
      - name: Ký bộ cài bằng SignPath
        if: ${{ env.SIGNPATH_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: vn-stock-insight
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer
      - name: Đưa bộ cài đã ký vào thư mục phát hành
        if: ${{ env.SIGNPATH_TOKEN != '' }}
        shell: pwsh
        run: Copy-Item signed-installer\*-setup.exe dist\ -Force

      - name: Bản portable (không cần cài, không chạy trình cài đặt)
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\vn-stock-insight-$env:VERSION-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v7
        with: { name: windows, path: dist/* }

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build macos --release
      - run: |
          mkdir -p dist
          PACKAGE_VERSION="${VERSION#v}"
          pkgbuild \
            --component "build/macos/Build/Products/Release/VN Stock Insight.app" \
            --identifier vn.stockinsight.vnStockInsight \
            --version "$PACKAGE_VERSION" \
            --install-location /Applications \
            "dist/vn-stock-insight-${VERSION}-macos.pkg"
          # Bản .app nén dùng cho cập nhật tự động trong app (app tải về, thay đúng bản đang chạy, mở lại)
          ditto -c -k --keepParent "build/macos/Build/Products/Release/VN Stock Insight.app" "dist/vn-stock-insight-${VERSION}-macos.zip"
      - uses: actions/upload-artifact@v7
        with: { name: macos, path: dist/* }

  # Bản phát hành phải mang danh tính của chủ repo, không phải github-actions[bot]:
  # - Có secret RELEASE_TOKEN (token cá nhân, quyền Contents: write): workflow tự phát hành dưới tên bạn.
  # - Không có: workflow chỉ build; chạy `tool/publish_release.sh <tag>` trên máy để phát hành bằng tài khoản gh của bạn.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Tạo bản phát hành (nếu có RELEASE_TOKEN)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::Chưa có RELEASE_TOKEN. Chạy tool/publish_release.sh $GITHUB_REF_NAME trên máy để phát hành dưới tên bạn."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "VN Stock Insight $GITHUB_REF_NAME" --notes "$(cat <<'EOF'
          Dashboard mới: thanh chỉ số nhanh, bố cục thị trường gọn hơn và bản đồ nhiệt theo biến động, khối ngoại hoặc thanh khoản.

          Tải bản cho máy của bạn:
          - Windows: tải file `-windows-x64-setup.exe` và làm theo trình cài đặt, hoặc `-windows-x64-portable.zip` để giải nén và chạy trực tiếp. Nếu SmartScreen cảnh báo, xem hướng dẫn trong README (mục Windows).
          - macOS: tải file `-macos.pkg` và mở để cài ứng dụng vào Applications. Gói hiện chưa được ký/notarize bằng Apple Developer ID; macOS có thể yêu cầu xác nhận khi mở. File `-macos.zip` dùng cho cập nhật tự động trong app.
          - Linux: file `-linux-x64.tar.gz`, giải nén rồi chạy `./vn-stock-insight/install.sh`.
          - Android: file `.apk`, mở để cài (cho phép cài từ nguồn không xác định).
          EOF
          )"
