name: Triển khai Edge Function

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/functions.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
    steps:
      - name: Kiểm tra cấu hình
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_URL" ]; then
            echo "Chưa có SUPABASE_ACCESS_TOKEN hoặc SUPABASE_URL, bỏ qua triển khai."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          # https://<project-ref>.supabase.co → <project-ref>
          echo "ref=$(echo "$SUPABASE_URL" | sed -E 's#https://([^.]+)\..*#\1#')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != 'true'
        with:
          version: 2.120.0

      - name: Cập nhật secret cho hàm
        if: steps.check.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: supabase secrets set --project-ref "${{ steps.check.outputs.ref }}" ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"

      - name: Triển khai hàm analyze
        if: steps.check.outputs.skip != 'true'
        run: supabase functions deploy analyze --project-ref "${{ steps.check.outputs.ref }}" --use-api
