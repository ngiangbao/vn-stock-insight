name: Cập nhật dữ liệu

on:
  schedule:
    # Giờ UTC, thứ 2 đến thứ 6. 01:30 UTC = 8:30 sáng VN (trước giờ mở cửa),
    # 05:00 UTC = 12:00 trưa VN (nghỉ trưa), 08:15 UTC = 15:15 chiều VN (sau đóng cửa)
    - cron: "30 1 * * 1-5"
    - cron: "0 5 * * 1-5"
    - cron: "15 8 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Chạy pipeline và tải kết quả lên Supabase
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m pipeline.main

      # Dữ liệu chỉ nằm trong Supabase (riêng tư), không đưa lên trang công khai
      - name: Chuẩn bị trang web
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          rm -rf site/data
          printf 'window.APP_CONFIG = { supabaseUrl: "%s", supabaseAnonKey: "%s" };\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > site/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
