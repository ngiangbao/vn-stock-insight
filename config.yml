# Chỉ giữ tin trong khoảng thời gian này (giờ)
news_max_age_hours: 48

ai:
  # Model rẻ, nhanh: phân loại và tóm tắt hàng trăm tin
  news_model: claude-haiku-5-5
  # Model mạnh: phân tích chi tiết từng mã và nhận định thị trường
  analysis_model: claude-opus-5-5
  # Mức suy nghĩ cho phân tích: low | medium | high | xhigh | max
  analysis_effort: high
