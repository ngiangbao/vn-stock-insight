name: vn_stock_insight
description: Trợ lý phân tích cổ phiếu Việt Nam bằng AI (Claude API hoặc model chạy trên máy).
publish_to: "none"

# Phiên bản app. Khi phát hành: tăng số này và tạo tag git trùng tên (vd: v1.0.1).
version: 2.1.0+22

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  http: 1.6.0
  xml: 7.1.0
  shared_preferences: 2.5.6
  flutter_secure_storage: 11.2.0
  url_launcher: 6.3.3
  package_info_plus: 10.2.2
  path_provider: 2.1.6
  crypto: 3.0.7
  qr: 4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: 2.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/models.json
    - assets/runtime.json
    - assets/web/
